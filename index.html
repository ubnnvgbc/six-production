<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時匯率換算</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 設定 Tailwind 的 dark mode 為 class 策略 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 隱藏數字輸入框的上下箭頭 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen transition-colors duration-300 flex items-center justify-center p-4 font-sans bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">

    <div class="w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden border transition-colors duration-300 bg-white border-slate-100 dark:bg-slate-900 dark:border-slate-800 dark:shadow-blue-900/20">
        
        <!-- 標題列 -->
        <div class="p-6 pb-2 flex justify-between items-center transition-colors bg-white dark:bg-slate-900">
            <h2 class="text-xl font-extrabold flex items-center gap-2 text-slate-700 dark:text-white">
                <span class="p-1.5 rounded-lg bg-blue-600 text-white shadow-lg shadow-blue-500/50 dark:shadow-blue-500/50">
                    <i data-lucide="trending-up" width="18" height="18"></i>
                </span>
                匯率換算
            </h2>
            
            <div class="flex items-center gap-2">
                <!-- 主題切換按鈕 -->
                <button id="theme-toggle" class="p-2 rounded-full transition-colors bg-slate-100 hover:bg-slate-200 text-slate-500 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-yellow-400 dark:shadow-sm dark:shadow-yellow-400/20">
                    <i data-lucide="moon" width="16" height="16" class="hidden dark:block"></i>
                    <i data-lucide="sun" width="16" height="16" class="block dark:hidden"></i>
                </button>

                <!-- 更新按鈕 -->
                <button id="refresh-btn" class="flex items-center gap-2 text-xs px-3 py-1.5 rounded-full transition-all duration-300 bg-slate-100 text-slate-400 hover:bg-slate-200 hover:text-slate-600 dark:bg-slate-800 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-slate-200 dark:shadow-sm dark:shadow-blue-500/20">
                    <span id="update-text">更新...</span>
                    <i id="refresh-icon" data-lucide="refresh-cw" width="12" height="12"></i>
                    <i id="check-icon" data-lucide="check" width="12" height="12" class="hidden"></i>
                </button>
            </div>
        </div>

        <!-- 換算核心區 -->
        <div class="p-6 space-y-4">
          
            <!-- 來源貨幣 (上) -->
            <div class="p-4 rounded-2xl border transition-all focus-within:ring-2 focus-within:ring-blue-500 bg-slate-50 border-slate-200 dark:bg-slate-800 dark:border-slate-700 dark:shadow-inner dark:shadow-blue-900/10">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold text-slate-400 dark:text-slate-400">持有金額</label>
                    <select id="from-currency" class="bg-transparent text-sm font-bold focus:outline-none text-right cursor-pointer text-slate-600 dark:text-slate-300">
                        <!-- Options generated by JS -->
                    </select>
                </div>
                <input
                    type="number"
                    id="amount-input"
                    value="1000"
                    class="w-full bg-transparent text-4xl font-extrabold outline-none transition-colors text-slate-800 placeholder-slate-300 dark:text-white dark:placeholder-slate-600"
                    placeholder="0"
                />
                <div id="from-currency-name" class="text-xs mt-1 text-slate-400 dark:text-slate-500">
                    日圓
                </div>
            </div>

            <!-- 交換按鈕 -->
            <div class="relative h-6">
                <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10">
                    <button id="swap-btn" class="p-3 rounded-full shadow-lg border-4 transition-all active:scale-90 bg-blue-600 text-white border-white hover:bg-blue-700 dark:border-slate-900 dark:hover:bg-blue-500 dark:shadow-blue-500/50">
                        <i data-lucide="arrow-up-down" width="20" height="20"></i>
                    </button>
                </div>
                <div class="absolute top-1/2 w-full border-t border-slate-100 dark:border-slate-800"></div>
            </div>

            <!-- 目標貨幣 (下) -->
            <div class="p-4 rounded-2xl border transition-colors bg-blue-50 border-blue-100 dark:bg-blue-900/20 dark:border-blue-800/50 dark:shadow-inner dark:shadow-blue-500/10">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold text-blue-400 dark:text-blue-300">換算結果</label>
                    <select id="to-currency" class="bg-transparent text-sm font-bold focus:outline-none text-right cursor-pointer text-blue-600 dark:text-blue-300">
                        <!-- Options generated by JS -->
                    </select>
                </div>
                <div id="result-display" class="text-4xl font-extrabold truncate transition-colors text-blue-700 dark:text-blue-200">
                    ---
                </div>
                <div class="flex justify-between items-center mt-1">
                    <div id="to-currency-name" class="text-xs text-blue-400 dark:text-blue-400">
                        新台幣
                    </div>
                    <div id="exchange-rate-display" class="text-xs font-mono px-2 py-0.5 rounded bg-blue-100 text-blue-400 dark:bg-blue-900/40 dark:text-blue-300 dark:shadow-sm dark:shadow-blue-500/20">
                        1 JPY ≈ --- TWD
                    </div>
                </div>
            </div>

        </div>

        <!-- 底部說明 -->
        <div id="error-msg" class="hidden px-6 pb-4 text-center text-xs text-red-400"></div>
        <div class="p-3 text-center border-t transition-colors bg-slate-50 border-slate-100 dark:bg-slate-900 dark:border-slate-800">
            <p class="text-[10px] text-slate-400 flex items-center justify-center gap-1">
                <i data-lucide="info" width="10" height="10"></i> 僅供參考，實際交易以銀行為準
            </p>
        </div>

    </div>

    <script>
        // 資料定義
        const CURRENCIES = [
            { code: 'TWD', name: '新台幣', flag: '🇹🇼' },
            { code: 'USD', name: '美元', flag: '🇺🇸' },
            { code: 'JPY', name: '日圓', flag: '🇯🇵' },
            { code: 'CNY', name: '人民幣', flag: '🇨🇳' },
            { code: 'KRW', name: '韓元', flag: '🇰🇷' },
            { code: 'EUR', name: '歐元', flag: '🇪🇺' },
            { code: 'GBP', name: '英鎊', flag: '🇬🇧' },
            { code: 'HKD', name: '港幣', flag: '🇭🇰' },
            { code: 'THB', name: '泰銖', flag: '🇹🇭' },
            { code: 'AUD', name: '澳幣', flag: '🇦🇺' },
            { code: 'SGD', name: '新加坡幣', flag: '🇸🇬' },
        ];

        // 狀態變數
        let state = {
            amount: 1000,
            fromCurrency: 'JPY',
            toCurrency: 'TWD',
            rates: {},
            lastUpdated: null,
            loading: true,
            error: null
        };

        // DOM 元素
        const els = {
            amountInput: document.getElementById('amount-input'),
            fromSelect: document.getElementById('from-currency'),
            toSelect: document.getElementById('to-currency'),
            fromName: document.getElementById('from-currency-name'),
            toName: document.getElementById('to-currency-name'),
            resultDisplay: document.getElementById('result-display'),
            rateDisplay: document.getElementById('exchange-rate-display'),
            refreshBtn: document.getElementById('refresh-btn'),
            updateText: document.getElementById('update-text'),
            refreshIcon: document.getElementById('refresh-icon'),
            checkIcon: document.getElementById('check-icon'),
            swapBtn: document.getElementById('swap-btn'),
            themeToggle: document.getElementById('theme-toggle'),
            errorMsg: document.getElementById('error-msg'),
            html: document.documentElement
        };

        // 初始化
        function init() {
            // 渲染選單
            const options = CURRENCIES.map(c => 
                `<option value="${c.code}" class="bg-white text-slate-800 dark:bg-slate-800 dark:text-slate-200">
                    ${c.flag} ${c.code} ${c.name}
                </option>`
            ).join('');
            
            els.fromSelect.innerHTML = options;
            els.toSelect.innerHTML = options;
            
            // 設定初始值
            els.fromSelect.value = state.fromCurrency;
            els.toSelect.value = state.toCurrency;
            
            // 綁定事件
            els.amountInput.addEventListener('input', (e) => {
                state.amount = e.target.value;
                renderResult();
            });

            els.fromSelect.addEventListener('change', (e) => {
                state.fromCurrency = e.target.value;
                updateLabels();
                fetchRates();
            });

            els.toSelect.addEventListener('change', (e) => {
                state.toCurrency = e.target.value;
                updateLabels();
                renderResult();
            });

            els.swapBtn.addEventListener('click', () => {
                // 交換
                const temp = state.fromCurrency;
                state.fromCurrency = state.toCurrency;
                state.toCurrency = temp;
                
                // 更新 UI
                els.fromSelect.value = state.fromCurrency;
                els.toSelect.value = state.toCurrency;
                
                updateLabels();
                fetchRates();
            });

            els.refreshBtn.addEventListener('click', () => {
                fetchRates(true);
            });

            els.themeToggle.addEventListener('click', () => {
                els.html.classList.toggle('dark');
            });

            // 初始化 Lucide icon
            lucide.createIcons();
            
            // 開始抓取資料
            fetchRates();
        }

        function updateLabels() {
            const fromInfo = CURRENCIES.find(c => c.code === state.fromCurrency);
            const toInfo = CURRENCIES.find(c => c.code === state.toCurrency);
            els.fromName.textContent = fromInfo ? fromInfo.name : '';
            els.toName.textContent = toInfo ? toInfo.name : '';
        }

        async function fetchRates(isManualRefresh = false) {
            state.loading = true;
            state.error = null;
            updateLoadingUI();

            try {
                // 加上 timestamp 避免快取
                const response = await fetch(`https://api.exchangerate-api.com/v4/latest/${state.fromCurrency}?t=${Date.now()}`);
                if (!response.ok) throw new Error('無法獲取匯率數據');
                
                const data = await response.json();
                state.rates = data.rates;
                
                // 格式化時間
                const date = new Date(data.time_last_updated * 1000);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                state.lastUpdated = `${year}/${month}/${day} ${hours}:${minutes}`;
                
                state.loading = false;
                
                if (isManualRefresh) {
                    showSuccessState();
                } else {
                    updateLoadingUI();
                }
                
                renderResult();

            } catch (err) {
                console.error(err);
                state.error = '連線失敗，目前顯示為預估參考值';
                // Fallback 數據
                if (state.fromCurrency === 'JPY') {
                    state.rates = { TWD: 0.21, JPY: 1, USD: 0.0067 };
                } else {
                     // 簡單的 fallback
                     state.rates = { [state.toCurrency]: 1 };
                }
                state.loading = false;
                updateLoadingUI();
                renderResult();
            }
        }

        function renderResult() {
            // 錯誤訊息顯示
            if (state.error) {
                els.errorMsg.textContent = state.error;
                els.errorMsg.classList.remove('hidden');
            } else {
                els.errorMsg.classList.add('hidden');
            }

            // 計算
            const rate = state.rates[state.toCurrency];
            const amountVal = parseFloat(state.amount);

            if (!rate || isNaN(amountVal)) {
                els.resultDisplay.textContent = '---';
                els.rateDisplay.textContent = '---';
                return;
            }

            const result = amountVal * rate;
            els.resultDisplay.textContent = formatNumber(result, state.toCurrency);
            els.rateDisplay.textContent = `1 ${state.fromCurrency} ≈ ${rate} ${state.toCurrency}`;
        }

        function formatNumber(num, currency) {
            if (['JPY', 'KRW'].includes(currency) || currency === 'TWD') {
                return Math.round(num).toLocaleString();
            }
            return num.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function updateLoadingUI() {
            if (state.loading) {
                els.updateText.textContent = '更新中...';
                els.refreshIcon.classList.add('animate-spin');
                els.refreshIcon.classList.remove('hidden');
                els.checkIcon.classList.add('hidden');
            } else {
                els.updateText.textContent = state.lastUpdated || '更新';
                els.refreshIcon.classList.remove('animate-spin');
            }
        }

        function showSuccessState() {
            // 切換成綠色成功樣式
            els.refreshBtn.className = "flex items-center gap-2 text-xs px-3 py-1.5 rounded-full transition-all duration-300 bg-green-500 text-white shadow-sm shadow-green-500/50";
            els.updateText.textContent = "已更新";
            els.refreshIcon.classList.add('hidden');
            els.checkIcon.classList.remove('hidden');

            setTimeout(() => {
                // 還原樣式
                els.refreshBtn.className = "flex items-center gap-2 text-xs px-3 py-1.5 rounded-full transition-all duration-300 bg-slate-100 text-slate-400 hover:bg-slate-200 hover:text-slate-600 dark:bg-slate-800 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-slate-200 dark:shadow-sm dark:shadow-blue-500/20";
                updateLoadingUI();
                els.refreshIcon.classList.remove('hidden');
                els.checkIcon.classList.add('hidden');
            }, 2000);
        }

        // 啟動
        init();
    </script>
</body>
</html>
